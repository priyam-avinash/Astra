name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allow manual triggers from the Actions tab
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    env:
      # Force paper trading + JWT mode for the test environment
      PAPER_TRADING: "true"
      AUTH_MODE: "jwt"
      JWT_SECRET_KEY: "ci_test_secret_not_used_in_production"
      # In-memory SQLite is fine for tests
      DATABASE_URL: "sqlite:///./test_astra.db"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install minimal test deps (skip heavy ML libs to speed CI)
        run: |
          pip install --upgrade pip
          # Install only what the tests touch — skip tensorflow / keras / ccxt
          pip install \
            fastapi==0.110.0 uvicorn==0.27.1 \
            sqlalchemy==2.0.29 \
            pandas==2.2.1 numpy>=1.26.0 scikit-learn==1.4.1.post1 \
            pandas-ta>=0.3.14b0 \
            python-dotenv==1.0.1 yfinance==0.2.37 \
            passlib[bcrypt]==1.7.4 'bcrypt<4.1' \
            python-jose[cryptography]==3.3.0 \
            python-multipart==0.0.9 \
            requests>=2.31.0 \
            'httpx<0.28' pytest>=8.0 pytz redis

      - name: Run pytest
        run: pytest tests/ -v --tb=short --maxfail=5

  frontend-build:
    name: Frontend build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build production bundle
        env:
          VITE_API_URL: https://api.example.com
          VITE_WS_URL: wss://api.example.com
        run: npm run build

  docker-build:
    name: Docker build sanity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: astra-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: astra-frontend:ci
